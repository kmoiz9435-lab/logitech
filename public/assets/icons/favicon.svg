<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFF066"/>
            <stop offset="35%" stop-color="#FF7A00"/>
            <stop offset="75%" stop-color="#E60000"/>
            <stop offset="100%" stop-color="#990000"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- Background circle for high contrast on light & dark tabs -->
    <rect width="64" height="64" rx="14" fill="#0E1724"/>
    <g transform="translate(6, 4)">
        <!-- Flask neck / Induction rim -->
        <rect x="22" y="4" width="8" height="10" rx="2" fill="#E2E8F0"/>
        <path d="M19 14 L33 14 L44 33 A18 18 0 1 1 8 33 Z" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linejoin="round"/>
        <!-- Glowing induction molten core -->
        <circle cx="26" cy="34" r="12" fill="url(#heatGlow)" filter="url(#glow)"/>
        <!-- Hot center highlight -->
        <circle cx="26" cy="34" r="5" fill="#FFF9B3" opacity="0.9"/>
    </g>
</svg>
